      <!-- Sothebys Mobile Gallery -->

          alt="Sothebys Mobile Notify"
          data-lightbox="sothebys"
        />
        <img
          src="images/mobile/sothebys/sothebys_tablet.jpg"
          class="sm:col-span-2 sm:row-span-2 gallery-item ar-l"

        />
        <!-- <img src="images/mobile/sothebys/sothebys_mobileexplode.webp" class="mt-12 sm:col-span-2 md:col-span-2 lg:col-span-3 xl:col-span-4 2xl:col-span-5 gallery-item ar-l" alt="Sothebys Mobile Explode" data-lightbox="sothebys">  -->

          class="gallery-item ar-l box-shadow"
          data-lightbox="bridgestyle"
        />
      </div>

      <!-- Lightbox Modal for All Groups -->
      <div
        id="lightbox"
        class="fixed inset-0 z-50 flex items-center justify-center bg-gray-300/50 backdrop-blur-2xl hidden transition-opacity duration-300"
      >
        <button
          id="lightbox-close"
          type="button"
          class="absolute top-4 right-4 text-gray-800 text-3xl font-bold hover:text-gray-600 transition-colors duration-200"
        >
          &times;
        </button>
        <button
          id="lightbox-prev"
          type="button"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-800 text-3xl font-bold hidden hover:text-gray-600 transition-colors duration-200"
        >
          &#8592;
        </button>
        <div
          id="lightbox-content"
          class="max-w-full max-h-full flex items-center justify-center transition-all duration-300 ease-in-out"
        ></div>
        <button
          id="lightbox-next"
          type="button"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-800 text-3xl font-bold hidden hover:text-gray-600 transition-colors duration-200"
        >
          &#8594;
        </button>
      </div>
