<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  
  <!-- App Container Mockup -->
  <rect x="80" y="60" width="1440" height="780" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Header / Navigation Bar -->
  <rect x="80" y="60" width="1440" height="70" rx="12" fill="#ffffff"/>
  <circle cx="120" cy="95" r="7" fill="#dc3545"/>
  <circle cx="145" cy="95" r="7" fill="#ffc107"/>
  <circle cx="170" cy="95" r="7" fill="#28a745"/>
  <text x="210" y="102" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#111827">Mercury-GeoSight</text>
  <text x="400" y="101" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#6c757d">Enterprise Geospatial Intelligence Platform</text>
  <line x1="80" y1="130" x2="1520" y2="130" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Prompt Bar Area -->
  <rect x="140" y="155" width="1320" height="60" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <circle cx="175" cy="185" r="12" fill="#4f46e5" opacity="0.15"/>
  <text x="170" y="190" font-family="'Inter', system-ui, sans-serif" font-size="16" fill="#4f46e5">✦</text>
  <text x="205" y="191" font-family="'Inter', system-ui, sans-serif" font-size="16" fill="#212529">"Show supply chain disruptions and critical weather events along the Midwest rail corridor in the past 48 hours"</text>
  <rect x="1340" y="167" width="100" height="36" rx="6" fill="#111827"/>
  <text x="1362" y="190" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Generate</text>

  <!-- Left Sidebar (Telemetry & KPIs) -->
  <rect x="140" y="240" width="340" height="560" rx="8" fill="#fdfdfe" stroke="#e9ecef" stroke-width="1.5"/>
  <text x="165" y="275" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#212529">Operational Alerts</text>
  <rect x="165" y="300" width="290" height="70" rx="6" fill="#fff5f5" stroke="#fed7d7"/>
  <text x="180" y="328" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#9b2c2c">Severe Storm Cell Warning</text>
  <text x="180" y="350" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#c53030">Zone B4 • 4 Freight Trains Rerouted</text>

  <rect x="165" y="385" width="290" height="70" rx="6" fill="#fffaf0" stroke="#feebc8"/>
  <text x="180" y="413" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#c05621">Terminal Congestion Alert</text>
  <text x="180" y="435" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#dd6b20">Chicago Yard 8 • +4.2h Dwell Time</text>

  <rect x="165" y="470" width="290" height="150" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="180" y="500" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3748">AI Confidence &amp; Provenance</text>
  <rect x="180" y="520" width="260" height="10" rx="5" fill="#edf2f7"/>
  <rect x="180" y="520" width="245" height="10" rx="5" fill="#38a169"/>
  <text x="180" y="555" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#718096">98% Data Integrity Confidence</text>
  <text x="180" y="580" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#a0aec0">Sources: NOAA Doppler Radar, GPS Telematic Feeds</text>

  <!-- Central Map View -->
  <rect x="505" y="240" width="955" height="560" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Stylized Geospatial Map Grid and Polygons -->
  <line x1="505" y1="360" x2="1460" y2="360" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="505" y1="500" x2="1460" y2="500" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="505" y1="640" x2="1460" y2="640" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="720" y1="240" x2="720" y2="800" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="960" y1="240" x2="960" y2="800" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="1200" y1="240" x2="1200" y2="800" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Map Route Path -->
  <path d="M 600,680 Q 800,520 950,440 T 1350,340" fill="none" stroke="#6366f1" stroke-width="5" stroke-dasharray="10 6"/>
  <circle cx="600" cy="680" r="8" fill="#6366f1"/>
  <circle cx="950" cy="440" r="10" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1350" cy="340" r="8" fill="#10b981"/>
  
  <!-- Floating Card Overlay on Map -->
  <rect x="880" y="320" width="250" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="900" y="350" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Chicago Transfer Node</text>
  <text x="900" y="372" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#64748b">Verified Telemetry • 12 Active Trains</text>
  <text x="900" y="392" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2563eb">Audit Provenance &rarr;</text>
</svg>
