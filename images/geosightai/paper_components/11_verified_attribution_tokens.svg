<svg width="856" height="282" viewBox="0 0 856 282" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <style>
      .attr-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 700; fill: #222D2C; }
      .attr-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 400; fill: #5B6360; }
      .token-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 600; fill: #222D2C; }
      .token-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 400; fill: #707673; }
      .badge-verified { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 700; fill: #54C93F; }
    </style>
  
    <style>
      .spec-tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
      .spec-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; fill: #222D2C; }
    </style>
  </defs>

  <!-- Archival Canvas Base -->
  <rect width="856" height="282" rx="8" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

  <!-- Left: Component Box -->
  <g id="Component-11" transform="translate(16, 16)">

  

  <!-- Base Canvas -->
  <rect width="460" height="230" rx="6" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

  <!-- Attribution Panel -->
  <g id="Verified-Attribution-Tokens">
    <rect x="16" y="16" width="428" height="198" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>

    <rect x="16" y="16" width="428" height="38" rx="0" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
    <text x="28" y="36" class="attr-title">Verified Institutional Attribution &amp; Custody Credit</text>
    <text x="28" y="47" class="attr-sub">Explicit provenance metadata embedded into maps, exports, and audit snapshots</text>

    <!-- Token 1: UNICEF SDMX -->
    <g id="Token-UNICEF">
      <rect x="28" y="64" width="404" height="42" rx="3" fill="#EFECE6" stroke="#222D2C" stroke-width="0.8"/>
      <circle cx="48" cy="85" r="9" fill="#1A66A6"/>
      <path d="M44 85 H52 M48 80 A5 5 0 0 1 48 90 A5 5 0 0 1 48 80" stroke="#FFFFFF" stroke-width="0.7" fill="none"/>
      
      <text x="66" y="80" class="token-title">UNICEF Global Data Warehouse</text>
      <text x="66" y="94" class="token-sub">Standard SDMX 2.1 API Feed · Global Nutrition Tracking Pillar (NUT_SAM_BURDEN)</text>

      <rect x="340" y="73" width="82" height="20" rx="2" fill="#FFFFFF" stroke="#54C93F" stroke-width="1"/>
      <text x="348" y="87" class="badge-verified">✓ VERIFIED</text>
    </g>

    <!-- Token 2: UN Data Commons -->
    <g id="Token-Commons">
      <rect x="28" y="112" width="404" height="42" rx="3" fill="#EFECE6" stroke="#222D2C" stroke-width="0.8"/>
      <circle cx="48" cy="133" r="9" fill="#54C93F"/>
      <!-- Database cylinders -->
      <ellipse cx="48" cy="130" rx="5" ry="2" fill="#222D2C"/>
      <ellipse cx="48" cy="135" rx="5" ry="2" fill="#222D2C"/>
      
      <text x="66" y="128" class="token-title">United Nations Data Commons</text>
      <text x="66" y="142" class="token-sub">Cross-Agency Interoperability Schema (WHO / World Bank / WFP joint harmonization)</text>

      <rect x="340" y="121" width="82" height="20" rx="2" fill="#FFFFFF" stroke="#54C93F" stroke-width="1"/>
      <text x="348" y="135" class="badge-verified">✓ HARMONIZED</text>
    </g>

    <!-- Token 3: GeoSight Registry -->
    <g id="Token-GeoSight">
      <rect x="28" y="160" width="404" height="42" rx="3" fill="#EFECE6" stroke="#222D2C" stroke-width="0.8"/>
      <circle cx="48" cy="181" r="9" fill="#222D2C"/>
      <!-- Map Polygon / Pin -->
      <polygon points="48,175 52,185 44,185" fill="#F4D35A"/>
      
      <text x="66" y="176" class="token-title">UN GeoSight Spatial Data Registry</text>
      <text x="66" y="190" class="token-sub">Authoritative Subnational Boundaries (UN Geospatial Information Section / Kenya Survey)</text>

      <rect x="340" y="169" width="82" height="20" rx="2" fill="#FFFFFF" stroke="#222D2C" stroke-width="1"/>
      <text x="348" y="183" class="badge-verified" fill="#222D2C">✓ AUTHORITATIVE</text>
    </g>
  </g>


  </g>

  <!-- Right: UX Spec Sidecar -->
  <g id="UX-Spec-11">
    <rect x="500" y="16" width="340" height="250" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>
    <rect x="500" y="16" width="340" height="42" rx="0" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
    <rect x="514" y="27" width="90" height="18" rx="2" fill="#1A66A6"/>
    <text x="520" y="39" class="spec-tag" fill="#FFFFFF">UX SPEC &amp; RULES</text>
    <text x="612" y="40" class="spec-title">Attribution Tokens</text>

      <!-- Spec Bullet -->
      <g>
        <circle cx="518" cy="76" r="3" fill="#1A66A6"/>
        <text x="528" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">PURPOSE:</text>
        <text x="528" y="93" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Explicitly attributes every active indicator layer to</text>
        <text x="528" y="105" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">its authoritative publisher agency.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="518" cy="114" r="3" fill="#1A66A6"/>
        <text x="528" y="118" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">AFFORDANCE:</text>
        <text x="528" y="131" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Clicking token opens custodial license details and</text>
        <text x="528" y="143" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">automated sync refresh cadence.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="518" cy="152" r="3" fill="#1A66A6"/>
        <text x="528" y="156" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">ZERO AMBIGUITY:</text>
        <text x="528" y="169" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">No inferred custody; every data point linked directly</text>
        <text x="528" y="181" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">to UN, WHO, or ministry registry.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="518" cy="190" r="3" fill="#1A66A6"/>
        <text x="528" y="194" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">STANDARDS:</text>
        <text x="528" y="207" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Conforms to UN GeoSight open data governance and</text>
        <text x="528" y="219" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">citation mandates.</text>
      </g>
  </g>
</svg>