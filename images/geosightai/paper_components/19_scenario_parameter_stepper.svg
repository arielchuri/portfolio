<svg width="876" height="272" viewBox="0 0 876 272" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .step-head { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 700; fill: #222D2C; }
      .step-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 400; fill: #5B6360; }
      .param-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 700; fill: #707673; text-transform: uppercase; letter-spacing: 0.5px; }
      .toggle-txt { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 600; }
      .action-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
      .spec-tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
      .spec-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; fill: #222D2C; }
    </style>
  </defs>

  <!-- Archival Canvas Base -->
  <rect width="876" height="272" rx="8" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

  <!-- Left: Component 19 Container -->
  <g id="Component-19" transform="translate(16, 16)">
    <rect width="480" height="240" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>

    <!-- Header -->
    <rect width="480" height="42" rx="0" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
    <!-- Slider icon -->
    <circle cx="28" cy="21" r="9" fill="#1A66A6"/>
    <path d="M24 21 H32 M26 18 V24 M30 18 V24" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <text x="46" y="22" class="step-head">Triage Parameters: School Flood Isolation</text>
    <text x="46" y="34" class="step-sub">Configure flood return interval &amp; road cut-off radius</text>

    <!-- Parameter 1: Return Interval Segmented Control -->
    <g id="Param-Flood-Return">
      <text x="20" y="64" class="param-label">Flood Return Interval Scenario</text>
      <rect x="20" y="72" width="440" height="28" rx="3" fill="#EFECE6" stroke="#222D2C" stroke-width="1"/>
      
      <!-- Option A: 1-in-10 Yr -->
      <rect x="22" y="74" width="142" height="24" rx="2" fill="#FFFFFF" stroke="#222D2C" stroke-width="0.8"/>
      <text x="56" y="89" class="toggle-txt" fill="#222D2C">10-Year (Baseline)</text>
      
      <!-- Option B: 1-in-25 Yr (Selected) -->
      <rect x="168" y="74" width="144" height="24" rx="2" fill="#1A66A6"/>
      <text x="194" y="89" class="toggle-txt" fill="#FFFFFF">25-Year (Active Crisis)</text>
      
      <!-- Option C: 1-in-50 Yr -->
      <text x="350" y="89" class="toggle-txt" fill="#5B6360">50-Year (Severe Cat.)</text>
    </g>

    <!-- Parameter 2: Road Cutoff Distance Stepper -->
    <g id="Param-Buffer-Radius">
      <text x="20" y="126" class="param-label">Evacuation Route Cut-Off Sensitivity</text>
      <rect x="20" y="134" width="440" height="34" rx="3" fill="#FFFFFF" stroke="#DFDDD7" stroke-width="1"/>
      <circle cx="38" cy="151" r="5" fill="#D35B50"/>
      <text x="52" y="152" class="step-head" font-size="11">5 km Inundation Buffer</text>
      <text x="196" y="152" class="step-sub">Classifies facility as isolated if main route is submerged &gt; 30cm</text>
      
      <!-- Mini Stepper Buttons -->
      <rect x="400" y="140" width="24" height="22" rx="2" fill="#EFECE6" stroke="#222D2C" stroke-width="0.8"/>
      <text x="408" y="155" class="toggle-txt" fill="#222D2C">-</text>
      <rect x="430" y="140" width="24" height="22" rx="2" fill="#EFECE6" stroke="#222D2C" stroke-width="0.8"/>
      <text x="437" y="155" class="toggle-txt" fill="#222D2C">+</text>
    </g>

    <!-- Footer Action -->
    <rect y="184" width="480" height="56" rx="0" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
    <text x="20" y="210" class="step-sub" font-size="10.5">Applies multi-criteria spatial query to 3,420 educational facilities.</text>
    <rect x="306" y="196" width="154" height="32" rx="2" fill="#1A66A6" stroke="#222D2C" stroke-width="1"/>
    <text x="318" y="216" class="action-label">▶ Run Triage Ranking</text>
  </g>

  <!-- Right: UX Spec Sidecar -->
  <g id="UX-Spec-19">
    <rect x="520" y="16" width="340" height="240" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>
    <rect x="520" y="16" width="340" height="42" rx="0" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
    <rect x="534" y="27" width="90" height="18" rx="2" fill="#1A66A6"/>
    <text x="540" y="39" class="spec-tag" fill="#FFFFFF">UX SPEC &amp; RULES</text>
    <text x="632" y="40" class="spec-title">Scenario Parameter Stepper</text>

    <!-- Bullet 1 -->
    <g>
      <circle cx="538" cy="76" r="3" fill="#1A66A6"/>
      <text x="548" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">PURPOSE:</text>
      <text x="548" y="93" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Allows operational analysts to calibrate hazard return</text>
      <text x="548" y="105" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">intervals and distance buffers before model execution.</text>
    </g>

    <!-- Bullet 2 -->
    <g>
      <circle cx="538" cy="114" r="3" fill="#1A66A6"/>
      <text x="548" y="118" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">AFFORDANCE:</text>
      <text x="548" y="131" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Segmented control selects 10/25/50-yr flood model;</text>
      <text x="548" y="143" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">[▶ Run Triage Ranking] executes spatial analysis.</text>
    </g>

    <!-- Bullet 3 -->
    <g>
      <circle cx="538" cy="152" r="3" fill="#1A66A6"/>
      <text x="548" y="156" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">DATA INTEGRITY:</text>
      <text x="548" y="169" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Explicit threshold values ('&gt; 30cm inundation')</text>
      <text x="548" y="181" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">prevent ambiguous risk classification.</text>
    </g>

    <!-- Bullet 4 -->
    <g>
      <circle cx="538" cy="190" r="3" fill="#1A66A6"/>
      <text x="548" y="194" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">KEYBOARD SHORTCUT:</text>
      <text x="548" y="207" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Tab cycles parameters · Arrow keys toggle intervals ·</text>
      <text x="548" y="219" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">↵ immediately executes triage ranking query.</text>
    </g>
  </g>
</svg>