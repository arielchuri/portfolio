        <circle cx="478" cy="152" r="3" fill="#1A66A6"/>
        <text x="488" y="156" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">DATA INTEGRITY:</text>
        <text x="488" y="169" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Validates polygon registry (ISO 3166-2:KE) and</text>
        <text x="488" y="181" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">verifies cross-source custodial endpoints.</text>
      </g>
      <!-- Spec Bullet -->
