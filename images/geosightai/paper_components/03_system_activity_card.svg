        <circle cx="478" cy="190" r="3" fill="#1A66A6"/>
        <text x="488" y="194" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">WAITING PSYCHOLOGY:</text>
        <text x="488" y="207" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Replaces opaque spinners with calm, verifiable</text>
        <text x="488" y="219" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">milestone progress steps.</text>
      </g>
  </g>

