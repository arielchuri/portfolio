        <text x="488" y="93" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Communicates autonomous multi-step tool execution</text>
        <text x="488" y="105" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">and spatial reasoning stages.</text>
      </g>
      <!-- Spec Bullet -->
