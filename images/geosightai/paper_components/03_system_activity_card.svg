        <circle cx="478" cy="114" r="3" fill="#1A66A6"/>
        <text x="488" y="118" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">AFFORDANCE:</text>
        <text x="488" y="131" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Expandable trace accordion reveals tool parameters,</text>
        <text x="488" y="143" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">sub-queries, and latency metrics.</text>
      </g>
      <!-- Spec Bullet -->
