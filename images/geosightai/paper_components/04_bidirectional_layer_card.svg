<svg width="816" height="282" viewBox="0 0 816 282" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>


    <style>
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 700; fill: #222D2C; }
      .card-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 400; fill: #5B6360; }
      .stat-val { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; font-weight: 700; fill: #222D2C; }
      .stat-lbl { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 600; fill: #707673; text-transform: uppercase; }
      .btn-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 600; }
    </style>
  
    <style>
      .spec-tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
      .spec-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; fill: #222D2C; }
    </style>
  
    <style>
      .spec-tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
      .spec-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; fill: #222D2C; }
    </style>
  </defs>

  <!-- Archival Canvas Base -->
  <rect width="816" height="282" rx="8" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

  <!-- Left: Component Box -->
  <g id="Component-04" transform="translate(16, 16)">

  

  <!-- Archival Canvas Base -->
  <rect width="816" height="282" rx="8" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

  <!-- Left: Component Box -->
  <g id="Component-04" transform="translate(16, 16)">

  

  <!-- Background Canvas -->
  <rect width="420" height="230" rx="6" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

  <!-- AI Layer Tile -->
  <g id="AI-Layer-Card-Bidirectional">
    <rect x="16" y="16" width="388" height="198" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>

    <!-- Header & Native Link Cue -->
    <g id="Layer-Card-Header">
      <rect x="16" y="16" width="388" height="38" rx="0" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
      <!-- Active Map Eye Icon -->
      <path d="M30 35 C33 30 41 30 44 35 C41 40 33 40 30 35 Z" stroke="#222D2C" stroke-width="1.3" fill="none"/>
      <circle cx="37" cy="35" r="2.5" fill="#1A66A6"/>
      <text x="52" y="32" class="card-title">Severe Acute Malnutrition (SAM) Burden</text>
      <text x="52" y="45" class="card-sub">Layer ID: #KE-NUT-2024-ADM1</text>
      
      <!-- Native GeoSight Deep-Link Indicator -->
      <rect x="302" y="24" width="90" height="22" rx="2" fill="#FFFFFF" stroke="#1A66A6" stroke-width="1"/>
      <path d="M310 35 H320 M317 32 L320 35 L317 38" stroke="#1A66A6" stroke-width="1.2" stroke-linecap="round"/>
      <text x="325" y="39" class="btn-label" fill="#1A66A6" font-size="10">↗ Focus Map</text>
    </g>

    <!-- Subnational Metric Indicators Strip -->
    <g id="Metric-Strip">
      <!-- Metric Tile 1 -->
      <rect x="28" y="66" width="112" height="52" rx="2" fill="#EFECE6" stroke="#222D2C" stroke-width="0.8"/>
      <text x="36" y="82" class="stat-lbl">National Mean</text>
      <text x="36" y="103" class="stat-val">18.4%</text>
      <text x="78" y="103" class="card-sub" fill="#D35B50" font-weight="600">+3.1% YoY</text>

      <!-- Metric Tile 2 -->
      <rect x="150" y="66" width="112" height="52" rx="2" fill="#EFECE6" stroke="#222D2C" stroke-width="0.8"/>
      <text x="158" y="82" class="stat-lbl">Subnational Max</text>
      <text x="158" y="103" class="stat-val" fill="#D35B50">41.2%</text>
      <text x="206" y="103" class="card-sub">Garissa</text>

      <!-- Metric Tile 3 -->
      <rect x="272" y="66" width="120" height="52" rx="2" fill="#EFECE6" stroke="#222D2C" stroke-width="0.8"/>
      <text x="280" y="82" class="stat-lbl">County Coverage</text>
      <text x="280" y="103" class="stat-val">47/47</text>
      <text x="322" y="103" class="card-sub">100% Complete</text>
    </g>

    <!-- Deep-Link Interaction Callout -->
    <g id="Interaction-Footer">
      <rect x="28" y="130" width="364" height="40" rx="3" fill="#AED4F8" fill-opacity="0.3" stroke="#1A66A6" stroke-width="1"/>
      <circle cx="44" cy="150" r="7" fill="#1A66A6"/>
      <text x="41.5" y="153" font-family="monospace" font-size="9" fill="#FFFFFF" font-weight="700">i</text>
      <text x="58" y="147" class="card-title" font-size="11" fill="#1A66A6">Click card to focus map camera and inspect attributes</text>
      <text x="58" y="161" class="card-sub">Synchronizes camera bounds, filters county polygons, and activates legend panel.</text>
    </g>

    <!-- Quick Action Drawer Trigger -->
    <g id="Action-Row">
      <rect x="28" y="180" width="176" height="24" rx="2" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
      <text x="44" y="196" class="btn-label" fill="#222D2C">Swap Indicator Feed ⇄</text>

      <rect x="214" y="180" width="178" height="24" rx="2" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
      <text x="238" y="196" class="btn-label" fill="#222D2C">Cross-Source Compare ⚖</text>
    </g>
  </g>


  </g>

  <!-- Right: UX Spec Sidecar -->
  <g id="UX-Spec-04">
    <rect x="460" y="16" width="340" height="250" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>
    <rect x="460" y="16" width="340" height="42" rx="0" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
    <rect x="474" y="27" width="90" height="18" rx="2" fill="#1A66A6"/>
    <text x="480" y="39" class="spec-tag" fill="#FFFFFF">UX SPEC &amp; RULES</text>
    <text x="572" y="40" class="spec-title">Bidirectional Layer Card</text>

      <!-- Spec Bullet -->
      <g>
        <circle cx="478" cy="76" r="3" fill="#1A66A6"/>
        <text x="488" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">PURPOSE:</text>
        <text x="488" y="93" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Bridges Copilot chat narrative outputs with the</text>
        <text x="488" y="105" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">interactive map viewport.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="478" cy="114" r="3" fill="#1A66A6"/>
        <text x="488" y="118" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">AFFORDANCE:</text>
        <text x="488" y="131" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">[↗ Focus Map] flies camera to layer bounds and</text>
        <text x="488" y="143" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">opens polygon attribute inspector.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="478" cy="152" r="3" fill="#1A66A6"/>
        <text x="488" y="156" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">DATA INTEGRITY:</text>
        <text x="488" y="169" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Displays canonical layer ID (#KE-NUT-2024-ADM1)</text>
        <text x="488" y="181" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">and verifies 100% county reporting completeness.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="478" cy="190" r="3" fill="#1A66A6"/>
        <text x="488" y="194" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">HOVER SYNC:</text>
        <text x="488" y="207" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Hovering card highlights corresponding polygon</text>
        <text x="488" y="219" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">features synchronously on map canvas.</text>
      </g>
  </g>

  </g>

  <!-- Right: UX Spec Sidecar -->
  <g id="UX-Spec-04">
    <rect x="460" y="16" width="340" height="250" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>
    <rect x="460" y="16" width="340" height="42" rx="0" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
    <rect x="474" y="27" width="90" height="18" rx="2" fill="#1A66A6"/>
    <text x="480" y="39" class="spec-tag" fill="#FFFFFF">UX SPEC &amp; RULES</text>
    <text x="572" y="40" class="spec-title">Bidirectional Layer Card</text>

      <!-- Spec Bullet -->
      <g>
        <circle cx="478" cy="76" r="3" fill="#1A66A6"/>
        <text x="488" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">PURPOSE:</text>
        <text x="488" y="93" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Bridges Copilot chat narrative outputs with the</text>
        <text x="488" y="105" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">interactive map viewport.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="478" cy="114" r="3" fill="#1A66A6"/>
        <text x="488" y="118" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">AFFORDANCE:</text>
        <text x="488" y="131" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">[↗ Focus Map] flies camera to layer bounds and</text>
        <text x="488" y="143" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">opens polygon attribute inspector.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="478" cy="152" r="3" fill="#1A66A6"/>
        <text x="488" y="156" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">DATA INTEGRITY:</text>
        <text x="488" y="169" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Displays canonical layer ID (#KE-NUT-2024-ADM1)</text>
        <text x="488" y="181" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">and verifies 100% county reporting completeness.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="478" cy="190" r="3" fill="#1A66A6"/>
        <text x="488" y="194" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">HOVER SYNC:</text>
        <text x="488" y="207" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Hovering card highlights corresponding polygon</text>
        <text x="488" y="219" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">features synchronously on map canvas.</text>
      </g>
  </g>
</svg>