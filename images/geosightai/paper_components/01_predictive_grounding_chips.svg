<svg width="780" height="292" viewBox="0 0 780 292" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .chip-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 500; }
      .section-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; fill: #707673; letter-spacing: 0.5px; }
      .meta-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 400; fill: #5B6360; }
      .action-btn-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.2px; }
      .spec-tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
      .spec-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; fill: #222D2C; }
    </style>
  </defs>

  <!-- Archival Canvas Base -->
  <rect width="780" height="292" rx="8" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

  <!-- Left: Component Box -->
  <g id="Component-01" transform="translate(16, 16)">

    <!-- Dropdown Container -->
    <rect width="384" height="204" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>

    <!-- Category 1: Admin Regions -->
    <text x="14" y="24" class="section-label">Administrative Regions (Location Focus)</text>

    <!-- Item 1: Garissa Active Hover -->
    <g id="Item-Region-Garissa">
      <rect x="10" y="32" width="364" height="30" rx="3" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
      <path d="M24 42 C24 39.5 26 37.5 28.5 37.5 C31 37.5 33 39.5 33 42 C33 45.5 28.5 49.5 28.5 49.5 C28.5 49.5 24 45.5 24 42 Z" fill="none" stroke="#1A66A6" stroke-width="1.2"/>
      <circle cx="28.5" cy="42" r="1.5" fill="#1A66A6"/>
      <text x="40" y="51" class="chip-text" fill="#222D2C" font-weight="600">Garissa County</text>
      <text x="128" y="51" class="meta-label">ADM1 · Kenya · 4 Sub-counties</text>
      <rect x="296" y="37" width="72" height="20" rx="2" fill="#1A66A6" stroke="#222D2C" stroke-width="0.8"/>
      <text x="306" y="51" class="action-btn-text" fill="#FFFFFF">📍 LOCATE</text>
    </g>

    <!-- Category 2: Indicators & Hazard Overlays -->
    <text x="14" y="80" class="section-label">SDG Indicators &amp; Hazard Overlays</text>

    <!-- Item 2: Stunting -->
    <g id="Item-Indicator-Stunting">
      <rect x="10" y="88" width="364" height="30" rx="3" fill="#FFFFFF" stroke="#DFDDD7" stroke-width="1"/>
      <rect x="23" y="101" width="2.5" height="9" rx="0.5" fill="#54C93F"/>
      <rect x="27" y="97" width="2.5" height="13" rx="0.5" fill="#54C93F"/>
      <rect x="31" y="103" width="2.5" height="7" rx="0.5" fill="#54C93F"/>
      <text x="40" y="107" class="chip-text" fill="#222D2C">Stunting Prevalence (Under 5)</text>
      <text x="198" y="107" class="meta-label">UNICEF SDMX</text>
      <rect x="270" y="93" width="98" height="20" rx="2" fill="#EFECE6" stroke="#222D2C" stroke-width="0.8"/>
      <circle cx="279" cy="103" r="2.5" fill="#54C93F"/>
      <text x="286" y="107" class="chip-text" font-size="9" fill="#222D2C" font-weight="600">All 47 Counties</text>
    </g>

    <!-- Item 3: Drought Hazard -->
    <g id="Item-Hazard-Drought">
      <rect x="10" y="124" width="364" height="30" rx="3" fill="#FFFFFF" stroke="#DFDDD7" stroke-width="1"/>
      <path d="M28.5 131 C28.5 131 25.5 135 25.5 137.5 C25.5 139.5 26.8 141 28.5 141 C30.2 141 31.5 139.5 31.5 137.5 C31.5 131 28.5 131 28.5 131 Z" fill="#D35B50" stroke="#D35B50" stroke-width="0.8"/>
      <text x="40" y="143" class="chip-text" fill="#222D2C">Drought Anomaly (VCI &lt; 20)</text>
      <text x="190" y="143" class="meta-label">NDMA 1km Feed</text>
      <rect x="288" y="129" width="80" height="20" rx="2" fill="#FFFFFF" stroke="#D35B50" stroke-width="0.8"/>
      <text x="296" y="143" class="action-btn-text" fill="#D35B50">+ OVERLAY</text>
    </g>

    <!-- Footer Controls -->
    <rect x="0" y="170" width="384" height="34" rx="0" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
    <text x="12" y="191" class="meta-label" font-size="9.5">Use ↑↓ to navigate · [Esc] to dismiss</text>
    <rect x="274" y="177" width="98" height="20" rx="2" fill="#FFFFFF" stroke="#222D2C" stroke-width="1"/>
    <text x="284" y="191" class="action-btn-text" fill="#222D2C">↵ Insert Chip</text>

  </g>

  <!-- Right: UX Spec Sidecar -->
  <g id="UX-Spec-01">
    <rect x="424" y="16" width="340" height="260" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>
    <rect x="424" y="16" width="340" height="42" rx="0" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
    <rect x="438" y="27" width="90" height="18" rx="2" fill="#1A66A6"/>
    <text x="444" y="39" class="spec-tag" fill="#FFFFFF">UX SPEC &amp; RULES</text>
    <text x="536" y="40" class="spec-title">Predictive Entity Menu</text>

      <!-- Spec Bullet -->
      <g>
        <circle cx="442" cy="76" r="3" fill="#1A66A6"/>
        <text x="452" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">PURPOSE:</text>
        <text x="452" y="93" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Disambiguates typed text into verified spatial</text>
        <text x="452" y="105" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">entities before prompt submission.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="442" cy="114" r="3" fill="#1A66A6"/>
        <text x="452" y="118" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">AFFORDANCE:</text>
        <text x="452" y="131" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">[📍 LOCATE] centers camera; [+ OVERLAY] loads</text>
        <text x="452" y="143" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">hazard layer directly onto map canvas.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="442" cy="152" r="3" fill="#1A66A6"/>
        <text x="452" y="156" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">DATA INTEGRITY:</text>
        <text x="452" y="169" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">'All 47 Counties' confirms 100% coverage,</text>
        <text x="452" y="181" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">preventing spatial voids and reporting bias.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="442" cy="190" r="3" fill="#1A66A6"/>
        <text x="452" y="194" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">KEYBOARD FLOW:</text>
        <text x="452" y="207" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">↑↓ navigate candidates · ↵ locks chip into</text>
        <text x="452" y="219" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">chat input · Esc cancels and returns focus.</text>
      </g>
  </g>
</svg>