  <g id="Component-05" transform="translate(16, 16)">

  

  <!-- Background Base -->
  <rect width="460" height="380" rx="6" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

  <!-- Related Signals Panel Frame -->
  <g id="Related-Signals-Panel">
    <rect x="16" y="16" width="428" height="348" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>

    <!-- Panel Title Bar -->
    <g id="Title-Bar">
      <rect x="16" y="16" width="428" height="48" rx="0" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
      <!-- Sparkle Semantic Vector Icon -->
      <polygon points="34,32 37,24 40,32 48,35 40,38 37,46 34,38 26,35" fill="#1A66A6"/>
      <text x="56" y="36" class="panel-head">Related Signals &amp; Semantic Vector Matches</text>
      <text x="56" y="52" class="panel-sub">Layers frequently combined with SAM Malnutrition in Arid Zones</text>
    </g>

    <!-- Signal Card 1: Safe Water Access -->
    <g id="Signal-Item-1">
      <rect x="28" y="76" width="404" height="66" rx="3" fill="#FFFFFF" stroke="#222D2C" stroke-width="1"/>
      <circle cx="48" cy="104" r="10" fill="#DCE8F0" stroke="#1A66A6" stroke-width="1"/>
      <path d="M48 97 C48 97 44 103 44 105 C44 107.5 45.8 109 48 109 C50.2 109 52 107.5 52 105 C52 103 48 97 48 97 Z" fill="#1A66A6"/>
      
      <text x="68" y="97" class="item-name">Safe Water Access in Primary Schools</text>
      <text x="68" y="112" class="item-desc">SDG 6.1 · UNICEF WASH SDMX · All 47 Counties Coverage</text>
      <text x="68" y="126" class="item-desc" font-weight="600" fill="#1A66A6">Strong spatial inverse: Water deficits precede wasting spikes</text>

      <!-- Vector Match Score Badge -->
      <rect x="288" y="85" width="48" height="18" rx="2" fill="#E7E4DF" stroke="#222D2C" stroke-width="0.8"/>
      <text x="294" y="98" class="score-pill" fill="#222D2C">94% Match</text>

      <!-- One-Click Overlay Button -->
      <rect x="344" y="84" width="76" height="24" rx="2" fill="#1A66A6" stroke="#222D2C" stroke-width="1"/>
      <text x="353" y="100" class="btn-text">+ Add Layer</text>
    </g>

    <!-- Signal Card 2: Multidimensional Poverty Index -->
    <g id="Signal-Item-2">
      <rect x="28" y="152" width="404" height="66" rx="3" fill="#FFFFFF" stroke="#222D2C" stroke-width="1"/>
      <circle cx="48" cy="180" r="10" fill="#F5D6CE" stroke="#D35B50" stroke-width="1"/>
      <text x="44.5" y="184" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#D35B50">$</text>

      <text x="68" y="173" class="item-name">Multidimensional Poverty Rate (Subnational)</text>
      <text x="68" y="188" class="item-desc">SDG 1.2.2 · Kenya National Bureau of Statistics (KNBS) / UNDP</text>
      <text x="68" y="202" class="item-desc" font-weight="600" fill="#D35B50">High co-occurrence with chronic caloric vulnerability</text>

      <rect x="288" y="161" width="48" height="18" rx="2" fill="#E7E4DF" stroke="#222D2C" stroke-width="0.8"/>
