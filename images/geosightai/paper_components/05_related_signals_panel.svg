      <text x="68" y="249" class="item-name">Vegetation Condition Index (VCI-3M Anomaly)</text>
      <text x="68" y="264" class="item-desc">Sentinel-2 / NDMA Drought Early Warning Feed · 250m grid</text>
      <text x="68" y="278" class="item-desc" font-weight="600" fill="#707673">Direct causal driver: Pasture failure triggers pastoralist distress</text>

      <rect x="288" y="237" width="48" height="18" rx="2" fill="#E7E4DF" stroke="#222D2C" stroke-width="0.8"/>
      <text x="294" y="250" class="score-pill" fill="#222D2C">86% sim</text>

      <rect x="344" y="236" width="76" height="24" rx="2" fill="#1A66A6" stroke="#222D2C" stroke-width="1"/>
      <text x="353" y="252" class="btn-text">+ Add Layer</text>
    </g>

