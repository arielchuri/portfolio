  <!-- Archival Canvas Base -->
  <rect width="856" height="412" rx="8" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

  <!-- Left: Component Box -->
  <g id="Component-05" transform="translate(16, 16)">

  

  <!-- Archival Canvas Base -->
  <rect width="856" height="412" rx="8" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

