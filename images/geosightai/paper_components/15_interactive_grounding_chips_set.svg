<svg width="856" height="282" viewBox="0 0 856 282" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <style>
      .chip-txt { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 600; }
      .chip-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 500; }
      .group-label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; fill: #707673; letter-spacing: 0.5px; }
    </style>
  
    <style>
      .spec-tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
      .spec-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; fill: #222D2C; }
    </style>
  </defs>

  <!-- Archival Canvas Base -->
  <rect width="856" height="282" rx="8" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

  <!-- Left: Component Box -->
  <g id="Component-15" transform="translate(16, 16)">

  

  <!-- Base Canvas -->
  <rect width="460" height="200" rx="6" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

  <g id="Interactive-Grounding-Chips-Collection">
    <rect x="16" y="16" width="428" height="168" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>

    <rect x="16" y="16" width="428" height="34" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
    <text x="28" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#222D2C">Interactive Spatial Entity Chips (In-Chat &amp; Map Sync)</text>

    <!-- Group 1: Administrative Regions -->
    <text x="28" y="68" class="group-label">Administrative Boundaries (ADM1 / ADM2)</text>
    
    <!-- Chip 1: Garissa (Default State) -->
    <g id="Chip-Admin-Default">
      <rect x="28" y="76" width="124" height="28" rx="14" fill="#FFFFFF" stroke="#222D2C" stroke-width="1"/>
      <circle cx="42" cy="90" r="4" fill="#1A66A6"/>
      <text x="52" y="94" class="chip-txt" fill="#222D2C">Garissa</text>
      <text x="96" y="94" class="chip-sub" fill="#707673">ADM1</text>
    </g>

    <!-- Chip 2: Wajir (Selected / Hover Active State) -->
    <g id="Chip-Admin-Active">
      <rect x="160" y="76" width="124" height="28" rx="14" fill="#AED4F8" stroke="#1A66A6" stroke-width="1.3"/>
      <circle cx="174" cy="90" r="4" fill="#1A66A6"/>
      <text x="184" y="94" class="chip-txt" fill="#1A66A6">Wajir</text>
      <text x="218" y="94" class="chip-sub" fill="#1A66A6">4 Sub-Counties</text>
    </g>

    <!-- Chip 3: Kenya National -->
    <g id="Chip-Admin-National">
      <rect x="292" y="76" width="134" height="28" rx="14" fill="#EFECE6" stroke="#222D2C" stroke-width="1"/>
      <circle cx="306" cy="90" r="4" fill="#222D2C"/>
      <text x="316" y="94" class="chip-txt" fill="#222D2C">Kenya All</text>
      <text x="372" y="94" class="chip-sub" fill="#707673">All 47 Counties</text>
    </g>

    <!-- Group 2: Indicator Pillars & Hazard Overlays -->
    <text x="28" y="126" class="group-label">Indicators &amp; Hazard Overlays</text>

    <!-- Chip 4: SAM Malnutrition -->
    <g id="Chip-Indicator-Pillar">
      <rect x="28" y="134" width="168" height="28" rx="14" fill="#F5D6CE" stroke="#D35B50" stroke-width="1.2"/>
      <circle cx="42" cy="148" r="4" fill="#D35B50"/>
      <text x="52" y="152" class="chip-txt" fill="#D35B50">SAM Malnutrition</text>
      <text x="156" y="152" class="chip-sub" fill="#B6443B">SDG 2</text>
    </g>

    <!-- Chip 5: VCI Drought Hazard -->
    <g id="Chip-Hazard-Overlay">
      <rect x="204" y="134" width="138" height="28" rx="14" fill="#F4D35A" stroke="#222D2C" stroke-width="1"/>
      <!-- Hazard Diamond -->
      <polygon points="218,144 222,148 218,152 214,148" fill="#D35B50" stroke="#222D2C" stroke-width="0.5"/>
      <text x="228" y="152" class="chip-txt" fill="#222D2C">VCI Drought</text>
      <text x="298" y="152" class="chip-sub" fill="#5B6360">&lt; 20</text>
    </g>

    <!-- Chip 6: Safe Water Access -->
    <g id="Chip-WASH-Layer">
      <rect x="350" y="134" width="82" height="28" rx="14" fill="#DCE8F0" stroke="#1A66A6" stroke-width="1"/>
      <circle cx="364" cy="148" r="4" fill="#1A66A6"/>
      <text x="374" y="152" class="chip-txt" fill="#1A66A6">WASH</text>
      <text x="410" y="152" class="chip-sub" fill="#1A66A6">6.1</text>
    </g>
  </g>


  </g>

  <!-- Right: UX Spec Sidecar -->
  <g id="UX-Spec-15">
    <rect x="500" y="16" width="340" height="250" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>
    <rect x="500" y="16" width="340" height="42" rx="0" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
    <rect x="514" y="27" width="90" height="18" rx="2" fill="#1A66A6"/>
    <text x="520" y="39" class="spec-tag" fill="#FFFFFF">UX SPEC &amp; RULES</text>
    <text x="612" y="40" class="spec-title">Spatial Entity Chips Set</text>

      <!-- Spec Bullet -->
      <g>
        <circle cx="518" cy="76" r="3" fill="#1A66A6"/>
        <text x="528" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">PURPOSE:</text>
        <text x="528" y="93" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Embeds interactive administrative entities and SDG</text>
        <text x="528" y="105" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">indicators directly inside chat and tables.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="518" cy="114" r="3" fill="#1A66A6"/>
        <text x="528" y="118" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">AFFORDANCE:</text>
        <text x="528" y="131" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Clicking chip refocuses map camera directly to</text>
        <text x="528" y="143" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">the corresponding polygon bounds.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="518" cy="152" r="3" fill="#1A66A6"/>
        <text x="528" y="156" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">CLEAR ABBREVIATIONS:</text>
        <text x="528" y="169" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">'4 Sub-Counties' and 'All 47 Counties' eliminate</text>
        <text x="528" y="181" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">cryptic shorthand ambiguity.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="518" cy="190" r="3" fill="#1A66A6"/>
        <text x="528" y="194" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">COLOR TAXONOMY:</text>
        <text x="528" y="207" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Blue: Admin regions · Terracotta: Malnutrition ·</text>
        <text x="528" y="219" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Amber: Drought · Green: WASH access.</text>
      </g>
  </g>
</svg>