<svg width="856" height="282" viewBox="0 0 856 282" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <style>
      .tile-num { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #222D2C; }
      .tile-lbl { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; fill: #707673; }
      .tile-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 500; fill: #5B6360; }
    </style>
  
    <style>
      .spec-tag { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
      .spec-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; fill: #222D2C; }
    </style>
  </defs>

  <!-- Archival Canvas Base -->
  <rect width="856" height="282" rx="8" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

  <!-- Left: Component Box -->
  <g id="Component-16" transform="translate(16, 16)">

  

  <!-- Base Canvas -->
  <rect width="460" height="200" rx="6" fill="#EFECE6" stroke="#CECDC8" stroke-width="1"/>

  <g id="Reusable-Analytical-Tiles">
    <rect x="16" y="16" width="428" height="168" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>

    <rect x="16" y="16" width="428" height="34" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
    <text x="28" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#222D2C">Reusable Analytical Metric Tiles (Dark/Light Map Overlays)</text>

    <!-- Tile 1: National Metric with Sparkline -->
    <g id="Tile-National-Mean">
      <rect x="28" y="62" width="126" height="110" rx="3" fill="#EFECE6" stroke="#222D2C" stroke-width="1"/>
      <text x="38" y="80" class="tile-lbl">National Mean</text>
      <text x="38" y="104" class="tile-num">18.4%</text>
      
      <!-- Delta Sparkline (SVG Path with fill dots) -->
      <path d="M38 126 L56 122 L74 128 L92 118 L114 112 L136 108" stroke="#D35B50" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <circle cx="136" cy="108" r="2.5" fill="#D35B50"/>
      <rect x="38" y="142" width="60" height="18" rx="2" fill="#F5D6CE" stroke="#D35B50" stroke-width="0.8"/>
      <text x="44" y="155" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#D35B50">▲ +3.1% YoY</text>
    </g>

    <!-- Tile 2: Subnational Max Risk Area -->
    <g id="Tile-Subnational-Max">
      <rect x="166" y="62" width="126" height="110" rx="3" fill="#FFFFFF" stroke="#D35B50" stroke-width="1.5"/>
      <text x="176" y="80" class="tile-lbl" fill="#D35B50">Critical Peak Area</text>
      <text x="176" y="104" class="tile-num" fill="#D35B50">41.2%</text>
      <text x="176" y="122" class="tile-sub" font-weight="700" fill="#222D2C">Garissa County (ADM1)</text>
      <text x="176" y="136" class="tile-sub">148,200 children at risk</text>
      <rect x="176" y="142" width="76" height="18" rx="2" fill="#F5D6CE" stroke="#D35B50" stroke-width="0.8"/>
      <text x="182" y="155" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#D35B50">TIER-1 CRISIS</text>
    </g>

    <!-- Tile 3: Subnational Coverage & Completeness -->
    <g id="Tile-Subnational-Coverage">
      <rect x="304" y="62" width="126" height="110" rx="3" fill="#EFECE6" stroke="#222D2C" stroke-width="1"/>
      <text x="314" y="80" class="tile-lbl">County Coverage</text>
      <text x="314" y="104" class="tile-num">47/47</text>
      <text x="314" y="122" class="tile-sub" font-weight="700" fill="#222D2C">100% Complete</text>
      <text x="314" y="136" class="tile-sub">0 Missing Voids</text>
      <rect x="314" y="142" width="70" height="18" rx="2" fill="#FFFFFF" stroke="#54C93F" stroke-width="1"/>
      <text x="322" y="155" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#54C93F">COMPLETE</text>
    </g>
  </g>


  </g>

  <!-- Right: UX Spec Sidecar -->
  <g id="UX-Spec-16">
    <rect x="500" y="16" width="340" height="250" rx="4" fill="#FFFFFF" stroke="#222D2C" stroke-width="1.5"/>
    <rect x="500" y="16" width="340" height="42" rx="0" fill="#E7E4DF" stroke="#222D2C" stroke-width="1"/>
    <rect x="514" y="27" width="90" height="18" rx="2" fill="#1A66A6"/>
    <text x="520" y="39" class="spec-tag" fill="#FFFFFF">UX SPEC &amp; RULES</text>
    <text x="612" y="40" class="spec-title">Analytical Metric Tiles</text>

      <!-- Spec Bullet -->
      <g>
        <circle cx="518" cy="76" r="3" fill="#1A66A6"/>
        <text x="528" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">PURPOSE:</text>
        <text x="528" y="93" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Floating KPI summary tiles providing spatial context</text>
        <text x="528" y="105" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">over choropleth map layers.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="518" cy="114" r="3" fill="#1A66A6"/>
        <text x="528" y="118" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">AFFORDANCE:</text>
        <text x="528" y="131" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Clicking tile highlights critical peak outlier areas</text>
        <text x="528" y="143" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">(Garissa: 41.2%) on canvas.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="518" cy="152" r="3" fill="#1A66A6"/>
        <text x="528" y="156" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">DATA COMPLETENESS:</text>
        <text x="528" y="169" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">'100% Reporting (0 Voids)' verifies complete county</text>
        <text x="528" y="181" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">coverage before policy actions.</text>
      </g>
      <!-- Spec Bullet -->
      <g>
        <circle cx="518" cy="190" r="3" fill="#1A66A6"/>
        <text x="528" y="194" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#222D2C">DUAL HORIZON:</text>
        <text x="528" y="207" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">Reports both national aggregate mean and localized</text>
        <text x="528" y="219" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#5B6360">subnational maximums simultaneously.</text>
      </g>
  </g>
</svg>