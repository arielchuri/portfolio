<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <filter id="shadow-ds" x="-4%" y="-3%" width="108%" height="108%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="#0f172a" rx="10"/>
  <!-- Grid backdrop -->
  <path d="M 0 136 H 1200 M 0 272 H 1200 M 0 408 H 1200 M 0 544 H 1200" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6"/>
  <path d="M 240 0 V 680 M 480 0 V 680 M 720 0 V 680 M 960 0 V 680" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6"/>

  <g transform="translate(60, 45)" filter="url(#shadow-ds)">
    <rect width="1080" height="590" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="1080" height="64" rx="12" fill="#f8fafc"/>
    <line x1="0" y1="64" x2="1080" y2="64" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="35" y="40" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">GeoSight AI Design System &amp; Component Primitives</text>
    <rect x="910" y="20" width="135" height="26" rx="13" fill="#e0f2fe"/>
    <text x="925" y="37" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369a1">FIGMA UI KIT v2.4</text>
    
    <!-- Column 1: Semantic Color Tokens & States -->
    <g transform="translate(35, 95)">
      <text x="0" y="16" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.5">SEMANTIC AI &amp; TRUST TOKENS</text>
      
      <!-- Token 1 -->
      <g transform="translate(0, 36)">
        <circle cx="16" cy="16" r="16" fill="#2563eb"/>
        <text x="44" y="14" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Copilot Primary (#2563EB)</text>
        <text x="44" y="28" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#64748b">Active prompts &amp; primary GIS selections</text>
      </g>

      <!-- Token 2 -->
      <g transform="translate(0, 92)">
        <circle cx="16" cy="16" r="16" fill="#059669"/>
        <text x="44" y="14" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Verified PASS (#059669)</text>
        <text x="44" y="28" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#64748b">Cross-source variance &lt; 1% agreement</text>
      </g>

      <!-- Token 3 -->
      <g transform="translate(0, 148)">
        <circle cx="16" cy="16" r="16" fill="#d97706"/>
        <text x="44" y="14" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Discrepancy REVIEW (#D97706)</text>
        <text x="44" y="28" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#64748b">Flagged delta requiring manual signoff</text>
      </g>

      <!-- Token 4 -->
      <g transform="translate(0, 204)">
        <circle cx="16" cy="16" r="16" fill="#dc2626"/>
        <text x="44" y="14" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Critical Vulnerability (#DC2626)</text>
        <text x="44" y="28" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#64748b">Highest hazard tier (Catastrophic / Severe)</text>
      </g>

      <!-- Token 5 -->
      <g transform="translate(0, 260)">
        <circle cx="16" cy="16" r="16" fill="#0f172a"/>
        <text x="44" y="14" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Map Slate Canvas (#0F172A)</text>
        <text x="44" y="28" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#64748b">High-contrast basemap background</text>
      </g>
    </g>

    <!-- Column 2: Grounding Entity Chips & Reasoning Tokens -->
    <g transform="translate(380, 95)">
      <text x="0" y="16" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.5">GROUNDING CHIPS &amp; INTENT STATES</text>
      
      <!-- Chip 1: Admin Region -->
      <g transform="translate(0, 36)">
        <rect width="310" height="42" rx="21" fill="#eff6ff" stroke="#bfdbfe"/>
        <circle cx="22" cy="21" r="9" fill="#3b82f6"/>
        <text x="18" y="25" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">A</text>
        <text x="38" y="26" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">Region: Horn of Africa (Adm 1)</text>
      </g>

      <!-- Chip 2: Hazard Overlay -->
      <g transform="translate(0, 92)">
        <rect width="310" height="42" rx="21" fill="#fef2f2" stroke="#fecaca"/>
        <circle cx="22" cy="21" r="9" fill="#ef4444"/>
        <text x="18" y="25" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">H</text>
        <text x="38" y="26" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Hazard: Flash Flooding Inundation</text>
      </g>

      <!-- Chip 3: Indicator Pillar -->
      <g transform="translate(0, 148)">
        <rect width="310" height="42" rx="21" fill="#f0fdf4" stroke="#bbf7d0"/>
        <circle cx="22" cy="21" r="9" fill="#10b981"/>
        <text x="18" y="25" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">P</text>
        <text x="38" y="26" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">Pillar: Child Protection &amp; WASH</text>
      </g>

      <!-- Step reasoning badge -->
      <g transform="translate(0, 204)">
        <rect width="310" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="14" y="24" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b">AGENT STEP TRACE REASONING</text>
        <text x="14" y="44" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">&#8627; Executing Spatial Join (Admin 1 &#215; Risk)</text>
      </g>

      <!-- SHA256 Audit pill -->
      <g transform="translate(0, 276)">
        <rect width="310" height="40" rx="6" fill="#0f172a"/>
        <text x="16" y="25" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Snapshot Hash: 9e4f2b1d... (Frozen)</text>
      </g>
    </g>

    <!-- Column 3: Reusable Metric Tiles & KPI Primitives -->
    <g transform="translate(730, 95)">
      <text x="0" y="16" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.5">REUSABLE DATA CARDS</text>
      
      <!-- Card 1: Population Vulnerability -->
      <g transform="translate(0, 36)">
        <rect width="310" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="18" y="30" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">Children at Acute Risk</text>
        <text x="18" y="65" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="800" fill="#0f172a">2.41M</text>
        <rect x="18" y="78" width="85" height="20" rx="4" fill="#fee2e2"/>
        <text x="24" y="92" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#991b1b">&#8593; +18% vs 2023</text>
        <!-- Sparkline -->
        <polyline points="180,85 205,75 230,80 255,55 280,50" fill="none" stroke="#ef4444" stroke-width="2.5"/>
      </g>

      <!-- Card 2: Composite Burden Index -->
      <g transform="translate(0, 172)">
        <rect width="310" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="18" y="30" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">Priority County Coverage</text>
        <text x="18" y="65" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="800" fill="#0f172a">47 / 47</text>
        <rect x="18" y="78" width="92" height="20" rx="4" fill="#ecfdf5"/>
        <text x="24" y="92" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#065f46">&#10003; 100% Granularity</text>
        <!-- Sparkline -->
        <polyline points="180,75 205,70 230,65 255,58 280,48" fill="none" stroke="#10b981" stroke-width="2.5"/>
      </g>
    </g>

  </g>
</svg>
