<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <radialGradient id="studioBg" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#f9fafc"/>
      <stop offset="70%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#dde5ef"/>
    </radialGradient>
    <radialGradient id="contactShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2d41" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#28374b" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#28374b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spectrum1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f28f2e" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#73cc6b" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#47c2e0" stop-opacity="0.92"/>
      <stop offset="78%" stop-color="#3370f0" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#e08ad6" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="spectrum2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1493" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#fad13e" stop-opacity="0.82"/>
      <stop offset="68%" stop-color="#afeeee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3370f0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glassSpec" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#1e293b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="caBlur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Studio White/Silver Backdrop -->
  <rect width="1200" height="760" fill="url(#studioBg)"/>

  <!-- Ambient Chromatic Floor Caustic -->
  <ellipse cx="600" cy="615" rx="280" ry="42" fill="url(#contactShadow)"/>
  <ellipse cx="565" cy="612" rx="145" ry="18" fill="url(#spectrum1)" opacity="0.22" filter="url(#caBlur)"/>

  <!-- Soft Chromatic Dispersion Halo -->
  <path d="M 330 400 C 310 210, 490 130, 620 220 C 750 310, 880 200, 860 390 C 840 570, 650 580, 560 470 C 470 360, 350 570, 330 400 Z"
        fill="none" stroke="url(#spectrum1)" stroke-width="88" stroke-linecap="round" opacity="0.28" filter="url(#softGlow)"/>

  <!-- Red/Magenta Refracted Shift -->
  <path d="M 332 404 C 312 214, 492 134, 622 224 C 752 314, 882 204, 862 394 C 842 574, 652 584, 562 474 C 472 364, 352 574, 332 404 Z"
        fill="none" stroke="url(#spectrum2)" stroke-width="58" stroke-linecap="round" opacity="0.65" filter="url(#caBlur)"/>

  <!-- Cyan/Cobalt Primary Refracted Body -->
  <path d="M 326 396 C 306 206, 486 126, 616 216 C 746 306, 876 196, 856 386 C 836 566, 646 576, 556 466 C 466 356, 346 566, 326 396 Z"
        fill="none" stroke="url(#spectrum1)" stroke-width="64" stroke-linecap="round" opacity="0.88"/>

  <!-- Dark Silhouette Rim + Internal Fresnel Volume -->
  <path d="M 328 398 C 308 208, 488 128, 618 218 C 748 308, 878 198, 858 388 C 838 568, 648 578, 558 468 C 468 358, 348 568, 328 398 Z"
        fill="none" stroke="#243131" stroke-width="66" stroke-linecap="round" opacity="0.14"/>

  <!-- Crisp Studio Specular Highlights -->
  <path d="M 328 398 C 308 208, 488 128, 618 218 C 748 308, 878 198, 858 388 C 838 568, 648 578, 558 468 C 468 358, 348 568, 328 398 Z"
        fill="none" stroke="url(#glassSpec)" stroke-width="34" stroke-linecap="round"/>

  <path d="M 365 255 C 430 175, 535 168, 610 218"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M 832 308 C 862 365, 845 452, 782 505"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.72"/>

  <!-- Minimal Portfolio Metadata Tag -->
  <rect x="40" y="688" width="232" height="32" rx="2" fill="#f5f5f5" fill-opacity="0.72"/>
  <text x="56" y="709" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.06em" fill="#243131">WEBGL / 16-BAND DISPERSION</text>
</svg>
