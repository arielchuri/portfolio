<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <!-- Tabletop background -->
  <rect width="1200" height="720" fill="#faf7f0"/>
  <!-- Subtle mimeo grid -->
  <g stroke="#38145c" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 90H1200 M0 180H1200 M0 270H1200 M0 360H1200 M0 450H1200 M0 540H1200 M0 630H1200"/>
    <path d="M120 0V720 M240 0V720 M360 0V720 M480 0V720 M600 0V720 M720 0V720 M840 0V720 M960 0V720 M1080 0V720"/>
  </g>

  <!-- Map sheet (off-white #faf7f0 + hard mimeo-violet drop shadow) -->
  <rect x="448" y="88" width="660" height="440" fill="#38145c"/>
  <rect x="440" y="80" width="660" height="440" fill="#faf7f0" stroke="#38145c" stroke-width="2.5"/>
  <rect x="440" y="80" width="660" height="34" fill="#38145c"/>
  <text x="456" y="102" font-family="monospace" font-size="14" font-weight="700" fill="#faf7f0" letter-spacing="1.5">MAP — DUNGEON LEVEL 1 (17×11)</text>
  <!-- Cyan-blue vector drafting (#38bdf8) -->
  <g stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="square">
    <rect x="490" y="150" width="220" height="150"/>
    <rect x="760" y="170" width="270" height="190"/>
    <path d="M710 225 H760 M600 300 V390 H890 V360"/>
    <circle cx="570" cy="225" r="18" fill="#38bdf8" fill-opacity="0.22"/>
    <circle cx="885" cy="260" r="24" fill="#38bdf8" fill-opacity="0.22"/>
  </g>

  <!-- Character Sheet (cream #f6efdc + hard drop shadow) -->
  <rect x="88" y="118" width="420" height="460" fill="#38145c"/>
  <rect x="80" y="110" width="420" height="460" fill="#f6efdc" stroke="#38145c" stroke-width="2.5"/>
  <rect x="80" y="110" width="420" height="38" fill="#f6efdc" stroke="#38145c" stroke-width="2.5"/>
  <text x="98" y="135" font-family="serif" font-size="18" font-weight="700" fill="#38145c" letter-spacing="0.5">SIR ALDRIC THE PALE</text>
  <!-- Mimeo purple field shading -->
  <rect x="102" y="170" width="180" height="58" fill="#38145c" fill-opacity="0.06" stroke="#38145c" stroke-width="1.5"/>
  <rect x="298" y="170" width="180" height="58" fill="#38145c" fill-opacity="0.06" stroke="#38145c" stroke-width="1.5"/>
  <rect x="102" y="246" width="376" height="120" fill="#38145c" fill-opacity="0.05" stroke="#38145c" stroke-width="1.5"/>
  <rect x="102" y="384" width="376" height="160" fill="#38145c" fill-opacity="0.05" stroke="#38145c" stroke-width="1.5"/>
  <text x="114" y="192" font-family="monospace" font-size="11" font-weight="700" fill="#38145c">HP 14 / 14</text>
  <text x="310" y="192" font-family="monospace" font-size="11" font-weight="700" fill="#38145c">AC 16</text>
  <text x="114" y="268" font-family="monospace" font-size="11" font-weight="700" fill="#38145c">ATTRIBUTES &amp; SAVES</text>
  <text x="114" y="408" font-family="monospace" font-size="11" font-weight="700" fill="#38145c">INVENTORY &amp; SPELLS</text>

  <!-- Goldenrod Note (#e8a735 + hard drop shadow) -->
  <rect x="758" y="418" width="320" height="210" fill="#38145c"/>
  <rect x="750" y="410" width="320" height="210" fill="#e8a735" stroke="#38145c" stroke-width="2.5"/>
  <text x="770" y="442" font-family="monospace" font-size="13" font-weight="700" fill="#38145c">SESSION NOTES</text>
  <line x1="770" y1="454" x2="1050" y2="454" stroke="#38145c" stroke-width="1.5"/>
  <line x1="770" y1="490" x2="1040" y2="490" stroke="#38145c" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="770" y1="526" x2="1010" y2="526" stroke="#38145c" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="770" y1="562" x2="980" y2="562" stroke="#38145c" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- 3D Polyhedral Dice badge -->
  <polygon points="625,535 675,564 675,622 625,651 575,622 575,564" fill="#38145c"/>
  <polygon points="620,530 670,559 670,617 620,646 570,617 570,559" fill="#faf7f0" stroke="#38145c" stroke-width="2.5"/>
  <text x="605" y="596" font-family="monospace" font-size="22" font-weight="700" fill="#38145c">20</text>
</svg>
