<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crystal Lenses &amp; Wall Caustics</title>
  <link rel="stylesheet" href="../fonts/inter.css">
  <style>
    :root {
      --black: #243131;
      --accent: deeppink;
      --active: hotpink;
      --accent2: paleturquoise;
      --gray3: #666581;
      --gray2: #9190aa;
      --gray1: #d7d6ec;
      --white: whitesmoke;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--white);
      color: var(--black);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.004em;
      line-height: 1.45;
      cursor:
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><rect x="8" y="8" width="16" height="16" fill="%2335a7f4"/><rect x="8" y="8" width="4" height="4" fill="%23FF1493"/></svg>')
          8 8,
        auto;
    }

    a, button {
      cursor:
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><g stroke="%238B5CF6" stroke-width="2" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="5.64" y1="5.64" x2="18.36" y2="18.36"/><line x1="5.64" y1="18.36" x2="18.36" y2="5.64"/></g><rect x="10" y="10" width="4" height="4" fill="%23FFA500"/></svg>')
          12 12,
        auto !important;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1.25rem;
      padding: 0.9rem 1.25rem;
      background: rgba(245, 245, 245, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--gray1);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .back-link {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      text-decoration: underline;
      text-decoration-style: dotted;
      width: fit-content;
    }

    .back-link:hover { color: var(--active); }

    h1 {
      font-size: 1.08rem;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .btn {
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 500;
      padding: 0.36rem 0.7rem;
      border-radius: 0;
      border: 1px solid var(--gray2);
      background: rgba(255, 255, 255, 0.65);
      color: var(--black);
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .grid {
      padding: 0;
      margin: 0;
      width: 100%;
    }

    .win-card {
      background: #eae9f1;
      border: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .win-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 0.75rem;
      background: rgba(245, 245, 245, 0.85);
      border-bottom: 1px solid var(--gray1);
    }

    .win-title {
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .tag {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.1rem 0.35rem;
      border-radius: 2px;
      background: rgba(175, 238, 238, 0.45);
      border: 1px solid var(--accent2);
      color: var(--black);
    }

    .open-link {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: underline;
      text-decoration-style: dotted;
      white-space: nowrap;
    }

    .open-link:hover { color: var(--active); }

    .win-viewport {
      position: relative;
      width: 100%;
      height: calc(100vh - 58px);
      min-height: 460px;
      background: #eae9f1;
    }

    .win-viewport iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .hero-sample {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    body.show-hero .hero-sample {
      opacity: 1;
    }

    .hero-sample span {
      font-size: 2.35rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: transparent;
      -webkit-text-stroke: 1px var(--accent);
    }

    .win-meta {
      padding: 0.6rem 0.75rem;
      font-size: 0.76rem;
      color: var(--gray3);
      border-top: 1px solid var(--gray1);
      line-height: 1.45;
    }
  </style>
</head>
<body class="show-hero">
  <div class="topbar">
    <div class="title-block">
      <a href="../experiments.html" class="back-link">&larr; Experiments</a>
      <h1>Crystal Lenses &amp; Wall Caustics</h1>
    </div>
    <div class="actions">
      <button type="button" id="toggle-hero" class="btn active">Hero Text Overlay: ON</button>
      <button type="button" id="reload-all" class="btn">Reload</button>
    </div>
  </div>

  <main class="grid">
    <section class="win-card">
      <div class="win-viewport">
        <iframe src="lens-opt2-photon.html" title="Crystal Lenses and Wall Caustics"></iframe>
        <div class="hero-sample"><span>Ariel Churi</span></div>
      </div>
    </section>
  </main>

  <script>
    const toggleHeroBtn = document.getElementById('toggle-hero');
    toggleHeroBtn.addEventListener('click', () => {
      const active = document.body.classList.toggle('show-hero');
      toggleHeroBtn.classList.toggle('active', active);
      toggleHeroBtn.textContent = active ? 'Hero Text Overlay: ON' : 'Hero Text Overlay: OFF';
    });

    document.getElementById('reload-all').addEventListener('click', () => {
      document.querySelectorAll('iframe').forEach((f) => {
        f.src = f.src;
      });
    });
  </script>
</body>
</html>
